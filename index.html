<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你心裡的那條線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E6; --paper-deep:#EFE3D1; --card:#FFFDF8; --line:#E4D8C4; --track:#E9DCC8;
  --ink:#4A3628; --text:#5A4636; --muted:#9A7F66; --accent:#B08560; --accent-soft:#C9A27E;
  --sel-bg:#E8D5BE; --btn:#6B4E36; --btn-text:#FFFDF8;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#2A231E; --paper-deep:#352C25; --card:#332B25; --line:#4A3E34; --track:#4A3E34;
    --ink:#F0E5D6; --text:#E2D4C2; --muted:#AD977F; --accent:#C9A27E; --accent-soft:#A88663;
    --sel-bg:#5A4636; --btn:#E8D5BE; --btn-text:#2A231E;
  }
}
:root[data-theme="dark"]{
  --paper:#2A231E; --paper-deep:#352C25; --card:#332B25; --line:#4A3E34; --track:#4A3E34;
  --ink:#F0E5D6; --text:#E2D4C2; --muted:#AD977F; --accent:#C9A27E; --accent-soft:#A88663;
  --sel-bg:#5A4636; --btn:#E8D5BE; --btn-text:#2A231E;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--serif);-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:30rem;margin:0 auto;padding:2.5rem 1.4rem 3rem}
.screen{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.leaving{opacity:0;transition:opacity .25s ease}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.leaving{transition:none}}

.kicker{font-size:.75rem;color:var(--muted);letter-spacing:.15em;margin-bottom:1.8rem}
.title{font-size:1.75rem;line-height:1.4;color:var(--ink);font-weight:500;margin:0 0 .8rem;white-space:nowrap}
.h2{font-size:1.35rem;line-height:1.5;color:var(--ink);font-weight:500;margin:0 0 .8rem}
.rule{width:6rem;height:1.5px;background:var(--accent);margin-bottom:1.6rem}
p{margin:0}
.body{font-size:1rem;line-height:1.95;color:var(--text)}
.small{font-size:.82rem;line-height:1.8;color:var(--muted)}
.meta{display:flex;gap:1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);margin:1.6rem 0 .6rem}

.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--btn);color:var(--btn-text);border:none;border-radius:999px;padding:.85rem 2.6rem;font-family:var(--serif);font-size:1.02rem;cursor:pointer}
.btn-ghost{background:transparent;color:var(--btn);border:1px solid var(--btn);padding:.75rem 2rem;font-size:.95rem}
.center{display:flex;justify-content:center}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.progress{margin-bottom:1.8rem}
.progress .num{font-size:.75rem;color:var(--muted);margin-bottom:.35rem}
.progress .bar{height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.progress .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}

.recap{font-size:.85rem;line-height:1.75;color:var(--muted);margin-bottom:1rem}
.scene{font-size:1.02rem;line-height:1.95;color:var(--text);margin-bottom:.7rem}
.quote{font-size:1.15rem;line-height:1.7;color:var(--ink);margin:.2rem 0 1.4rem .2rem}
.msg{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:.8rem .9rem;margin:.4rem 0 1.4rem;font-family:var(--sans)}
.msg-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.avatar{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--sel-bg);flex:none}
.msg-from{font-size:.82rem;color:var(--text);flex:1}
.msg-time{font-size:.72rem;color:var(--muted)}
.msg p{font-size:.95rem;line-height:1.7;color:var(--text)}
.after{font-size:1.02rem;line-height:1.95;color:var(--text);margin-bottom:1.2rem}
.gap{height:.6rem}

.opts{display:flex;flex-direction:column;gap:.6rem;margin-top:.6rem}
.opt{width:100%;text-align:left;background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;font-family:var(--serif);font-size:.98rem;line-height:1.65;color:var(--text);cursor:pointer;transition:background .15s ease,border-color .15s ease}
.opt:hover{border-color:var(--accent-soft)}
.opt.sel{background:var(--sel-bg);border-color:var(--accent);color:var(--ink)}
.opts.locked .opt{pointer-events:none}

.inward{background:var(--paper-deep);border-radius:16px;padding:1.3rem 1.1rem 1.1rem}
.inward .ask{font-size:1.2rem;line-height:1.6;color:var(--ink);margin-bottom:1rem}

.slider-val{text-align:center;margin:2rem 0 1rem}
.slider-val b{font-weight:500;font-size:2.6rem;color:var(--btn)}
.slider-val span{font-size:.9rem;color:var(--muted);margin-left:.3rem}
input[type=range]{width:100%;accent-color:var(--btn)}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text);margin:.5rem 0 2rem}

.cmp{margin-bottom:2rem}
.cmp .lab{font-size:.85rem;color:var(--muted);margin-bottom:1rem}
.row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text);margin-bottom:.4rem}
.axis{position:relative;height:4px;background:var(--track);border-radius:2px;margin-bottom:1.1rem}
.dot{position:absolute;top:-5px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%)}
.dot.self{background:var(--accent-soft)}
.dot.real{background:var(--btn)}
.ends-sm{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin:-.5rem 0 1.1rem}
.rcard{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:1.2rem 1.1rem;margin-bottom:.9rem}
.rcard h3{font-size:1.08rem;font-weight:500;color:var(--ink);margin:0 0 .6rem}
.rcard p{font-size:.95rem;line-height:1.95;color:var(--text)}
.rcard p+p{margin-top:.7rem}
.rcard.letter{background:var(--paper-deep);border:none}
.tip{margin-bottom:1.1rem}
.tip h4{font-size:1rem;font-weight:500;color:var(--ink);margin:0 0 .4rem}
.tip p{font-size:.9rem;line-height:1.85}
.tip .k{color:var(--muted);margin-right:.4rem}
.closing{font-size:.88rem;line-height:1.85;color:var(--accent);margin-top:.4rem}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
/* ---------- 標記說明 ----------
g: 給  o=顧對方 m=折衷 s=顧自己
y: 說  d=直接 f=委婉 h=放心裡 a=躲開
h: 心  w=甘願 g=委屈 i=煩躁 l=放下 u=愧疚
c: 察  1=察覺 -1=沒察覺
gap / ok: 事情類型 t=時間被打斷 e=期待落空 f=勉強自己 u=付出沒被看見
p: 模式 after=事後補償 sna=察覺但不行動 ag=爭取後自責 avoid=先躲再說
f: 其他旗標
------------------------------- */

const QUESTIONS = [
{ id:1, rel:'partner', n:1,
  scene:{ pre:'週末晚上，你窩在沙發上打遊戲，正打到關鍵的地方。伴侶從房間走出來說：', quote:'「欸，可以來幫我一下嗎？」' },
  opts:[
    { t:'馬上放下去幫', rc:'你放下手把，起身去幫忙。', tg:{g:'o'},
      ext:{ scene:{pre:'過去才發現，只是要你幫忙拿櫃子上面的東西。拿完回來，遊戲已經輸了。'},
        opts:[
          {t:'算了，沒關係，繼續玩', tg:{h:'l',ok:'t'}},
          {t:'心裡有點悶，但不說', tg:{y:'h',h:'g',gap:'t'}},
          {t:'半開玩笑說：「你欠我一次喔」', tg:{y:'f'}},
          {t:'「下次這種不急的，可以等我一下嗎」', tg:{y:'d'}}
        ]}},
    { t:'「等我一下，弄完這段就來」', rc:'你說了聲「等我一下」，繼續打完這段。', tg:{g:'m'},
      ext:{ scene:{pre:'二十分鐘過去，對方又來叫你，語氣有點不耐煩。'},
        opts:[
          {t:'有點愧疚，趕快過去', tg:{g:'o',h:'u'}},
          {t:'覺得被催有點煩，但還是去', tg:{g:'o',h:'i'}},
          {t:'解釋剛剛真的停不下來', tg:{y:'f'}},
          {t:'「不是說好等一下嗎」', tg:{y:'d',h:'i'}}
        ]}},
    { t:'先問急不急，再決定', rc:'你先問了一句：「很急嗎？」', tg:{g:'m'},
      ext:{ scene:{pre:'對方說「不急啦」，但語氣聽起來有點失落。'},
        opts:[
          {t:'照字面理解，先繼續玩', tg:{g:'s',c:-1}},
          {t:'察覺到了，還是放下去幫', tg:{g:'o',c:1}},
          {t:'問對方：「你是不是不開心？」', tg:{y:'d',c:1}},
          {t:'繼續玩，但心裡一直在意', tg:{c:1,p:['sna']}}
        ]}},
    { t:'請對方先自己試試看', rc:'你請對方先自己試試看。', tg:{g:'s'},
      ext:{ scene:{pre:'過了一會兒，你聽到對方小聲說「算了，我自己來」，接著是東西掉下來的聲音。'},
        opts:[
          {t:'有點擔心，馬上過去看', tg:{g:'o',f:['late']}},
          {t:'有點愧疚，馬上過去看', tg:{g:'o',h:'u',p:['ag']}},
          {t:'喊一聲「怎麼了？」，但沒起身', tg:{g:'m'}},
          {t:'覺得對方在鬧脾氣，先不理', tg:{g:'s',c:-1}}
        ]}}
  ]},

{ id:2, rel:'partner', n:2,
  scene:{ pre:'你們約好這個週末，去一間期待了很久的店，你連那天要穿什麼都想好了。前一天晚上，手機跳出訊息：',
    msg:{from:'伴侶',time:'22:15',lines:['明天可以先不要出門嗎…','這週真的好累']} },
  opts:[
    { t:'「沒關係，你好好休息」，真心覺得沒差', rc:'你回了「沒關係，你好好休息」。', tg:{g:'o',h:'l',ok:'e'}, f:['genuine2'],
      ext:{ scene:{pre:'隔天下午，你看到對方發了限動，在家打遊戲，看起來很有精神。'},
        opts:[
          {t:'笑了一下，「真的沒差啦，對方開心就好」', tg:{h:'l',ok:'e'}},
          {t:'有點不舒服，但不說', tg:{y:'h',h:'g',gap:'e',f:['misread']}},
          {t:'傳訊息半開玩笑：「看起來很有精神嘛」', tg:{y:'f'}},
          {t:'直接問：「你不是說很累？」', tg:{y:'d'}}
        ]}},
    { t:'「沒關係啊」，但心裡其實有點失落', rc:'你回了「沒關係啊」，但心裡有點失落。', tg:{g:'o',y:'h',h:'g',gap:'e'},
      ext:{ scene:{pre:'隔天，對方傳來訊息：'}, msg:{from:'伴侶',time:'10:32',lines:['你是不是不開心？']},
        opts:[
          {t:'「沒有啊～我很好啦」', tg:{y:'h',gap:'e',f:['stillfine']}},
          {t:'「有一點點啦」', tg:{y:'f'}},
          {t:'坦白說其實很期待這次出去', tg:{y:'d'}},
          {t:'轉移話題', tg:{y:'a',p:['avoid']}}
        ]}},
    { t:'提議改去近一點、輕鬆一點的地方', rc:'你提議改去近一點、輕鬆一點的地方。', tg:{g:'m',y:'f'},
      ext:{ scene:{pre:'對方回：「可是我真的好累，可以就在家嗎？」'},
        opts:[
          {t:'「好吧～那就在家耍廢吧」，其實也覺得不錯', tg:{g:'o',h:'l',ok:'e'}},
          {t:'在家陪對方，但一整天心裡有點悶', tg:{g:'o',y:'h',h:'g',gap:'e'}},
          {t:'自己一個人去原本想去的地方', tg:{g:'s'}},
          {t:'「好，那下週一定要去喔」', tg:{g:'m',y:'d'}}
        ]}},
    { t:'直接說：「可是我很期待欸」', rc:'你說：「可是我很期待欸。」', tg:{g:'s',y:'d'},
      ext:{ scene:{pre:'對方沉默了一下，說「好啦，那還是去」。隔天出門，對方明顯沒什麼精神。'},
        opts:[
          {t:'「嗯…還好啦，至少有出來」', tg:{g:'s',h:'l'}},
          {t:'有點愧疚，提議早點回家', tg:{g:'o',h:'u',p:['ag']}},
          {t:'有點不爽，覺得對方在擺臉色', tg:{h:'i'}},
          {t:'問對方：「你還好嗎？要不要回去？」', tg:{g:'o',c:1}}
        ]}}
  ]},

{ id:3, rel:'closeFriend', n:3,
  scene:{ pre:'這週的事情一件接著一件，今天終於結束的時候，你整個人像被掏空。你窩在床上，正準備放下手機睡覺，螢幕突然亮了起來：',
    msg:{from:'最要好的朋友',time:'23:48',lines:['你睡了嗎','今天心情好差…可以聊聊嗎']} },
  opts:[
    { t:'撐著陪她聊', rc:'你撐著精神，陪她聊。', tg:{g:'o'},
      ext:{ scene:{pre:'聊到凌晨一點多，她說：'}, quote:'「謝謝你，抱歉讓你這麼晚還沒睡。」',
        opts:[
          {t:'「哎唷～跟我客氣什麼啦」，真心這麼覺得', tg:{h:'w',ok:'f'}},
          {t:'「沒事啦」，但其實已經累到不行', tg:{y:'h',h:'g',gap:'f'}},
          {t:'半開玩笑：「下次早點找我啦哈哈」', tg:{y:'f'}},
          {t:'坦白說自己今天其實也很累', tg:{y:'d'}}
        ]}},
    { t:'簡單安慰幾句，說要先睡了', rc:'你簡單安慰了幾句，說要先睡了。', tg:{g:'m',y:'f'},
      ext:{ scene:{pre:'她回了一句。平常她都會加表情符號，這次沒有。'}, msg:{from:'最要好的朋友',time:'23:55',lines:['好喔，晚安']},
        opts:[
          {t:'「嗯…應該沒事吧」，就去睡了', tg:{h:'l',c:-1}},
          {t:'注意到了，再補一句「明天一定找你聊」', tg:{g:'o',c:1}},
          {t:'有點不安，躺著一直睡不著', tg:{c:1,p:['sna']}},
          {t:'乾脆打電話給她', tg:{g:'o',c:1}}
        ]}},
    { t:'坦白說今天很累，約明天再聊', rc:'你坦白說今天很累，約她明天再聊。', tg:{g:'s',y:'d'},
      ext:{ scene:{pre:'隔天，她傳來訊息：'}, msg:{from:'最要好的朋友',time:'12:10',lines:['沒事了啦，昨天只是一時情緒']},
        opts:[
          {t:'「真的嗎～那就好」，鬆了一口氣', tg:{h:'l',c:-1}},
          {t:'覺得她可能只是不想說，再主動問問', tg:{g:'o',c:1}},
          {t:'有點愧疚昨天沒陪她', tg:{h:'u'}},
          {t:'約她出來吃東西', tg:{g:'o'}}
        ]}},
    { t:'先已讀，晚點再說', rc:'你先已讀，打算晚點再說。', tg:{g:'s',y:'a',p:['avoid']},
      ext:{ scene:{pre:'隔天早上醒來，你看到她凌晨又傳了一則：'}, msg:{from:'最要好的朋友',time:'01:26',lines:['沒事了，你睡吧']},
        opts:[
          {t:'「呼…還好沒事」', tg:{h:'l',c:-1}},
          {t:'很愧疚，馬上打給她', tg:{g:'o',h:'u',p:['after']}},
          {t:'回「抱歉昨天睡著了」', tg:{y:'a'}},
          {t:'傳訊息問她現在還好嗎', tg:{g:'o',p:['after']}}
        ]}}
  ]},

{ id:4, rel:'friend', n:4,
  scene:{ pre:'這個週末，你打算一個人待在家，什麼都不做。週四晚上，一個還算聊得來、但不算很熟的朋友傳來訊息：',
    msg:{from:'朋友',time:'21:30',lines:['週末要不要一起去逛市集？']} },
  opts:[
    { t:'還是答應出去', rc:'你還是答應了。', tg:{g:'o'},
      ext:{ scene:{pre:'出去到一半，你一直在滑手機，回話也心不在焉。對方停了一下，問：'}, quote:'「你今天是不是不太想出來？」',
        opts:[
          {t:'有點心虛，笑著說：「哈哈～沒有啦，只是有點累」', tg:{y:'h',gap:'f'}},
          {t:'坦白說其實本來想待在家', tg:{y:'d'}},
          {t:'覺得被看穿，有點尷尬', tg:{}},
          {t:'打起精神，表現得更投入', tg:{g:'o'}}
        ]}},
    { t:'找個理由推掉', rc:'你找了個理由推掉。', tg:{g:'s',y:'f'},
      ext:{ scene:{pre:'週末你在家，對方傳來一張大家玩得很開心的合照，看起來是真心想讓你下次也加入：'}, msg:{from:'朋友',time:'16:05',lines:['可惜你沒來～下次一起啦😆']},
        opts:[
          {t:'「哈哈～下次啦」，覺得在家剛剛好', tg:{h:'l'}},
          {t:'有點小後悔', tg:{}},
          {t:'有點心虛，怕理由被拆穿', tg:{h:'u'}},
          {t:'感受到對方的心意，多回了幾句', tg:{g:'o',c:1}}
        ]}},
    { t:'直接說想自己待著', rc:'你直接說，這週末想自己待著。', tg:{g:'s',y:'d'},
      ext:{ scene:{pre:'對方回了「喔喔好～」。之後好幾天，對方都沒再找你。'},
        opts:[
          {t:'「嗯～這樣也好」', tg:{h:'l'}},
          {t:'開始擔心是不是讓對方不舒服了', tg:{h:'u',p:['ag']}},
          {t:'主動找對方聊天', tg:{g:'o'}},
          {t:'如果因為這樣就疏遠，那也沒辦法', tg:{g:'s'}}
        ]}},
    { t:'回「晚點再看看」，先拖著', rc:'你回了「晚點再看看」。', tg:{y:'a',p:['avoid']},
      ext:{ scene:{pre:'週六早上，手機響了：'}, msg:{from:'朋友',time:'09:40',lines:['所以今天要出來嗎？']},
        opts:[
          {t:'「欸…好啦，那就出去吧」', tg:{g:'o'}},
          {t:'這時才找理由推掉', tg:{g:'s',y:'f'}},
          {t:'直接說今天想休息', tg:{g:'s',y:'d'}},
          {t:'先不回，假裝還沒起床', tg:{y:'a',p:['avoid']}}
        ]}}
  ]},

{ id:5, rel:'family', n:5,
  scene:{ pre:'今天從早上忙到晚上，回到家洗完澡已經快十一點。你剛躺上床、眼睛快要閉上時，媽媽在樓下喊：', quote:'「你下來幫我一下！」' },
  opts:[
    { t:'雖然很累，還是撐起來馬上下去', rc:'你撐起身，馬上下樓。', tg:{g:'o'},
      ext:{ scene:{pre:'原來是媽媽的手機不知道怎麼傳照片，這已經是你第三次教她了。'},

/* ---------- 狀態 ---------- */
let S;
function reset(){ S = { self:5, ans:[], qi:0 }; }
reset();

const app = document.getElementById('app');
const TOTAL_STEPS = QUESTIONS.length;

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(html, after){
  const old = app.firstElementChild;
  const swap = ()=>{
    app.innerHTML = '<div class="screen">'+html+'</div>';
    window.scrollTo(0,0);
    if(after) after();
    const h = app.querySelector('h1,h2,.scene,.ask');
    if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  };
  if(old && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    old.classList.add('leaving'); setTimeout(swap, 250);
  } else swap();
}

function progressHTML(){
  const q = QUESTIONS[S.qi];
  const pct = Math.round((S.qi+0.5)/TOTAL_STEPS*100);
  return `<div class="progress"><div class="num">${q.n} / 8</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>`;
}

function sceneHTML(sc, quote, msg){
  let h = '';
  if(sc && sc.pre) h += `<p class="scene">${esc(sc.pre)}</p>`;
  const qt = quote || (sc && sc.quote);
  const m = msg || (sc && sc.msg);
  if(qt) h += `<p class="quote">${esc(qt)}</p>`;
  if(m){
    h += `<div class="msg"><div class="msg-head"><div class="avatar" aria-hidden="true"></div><span class="msg-from">${esc(m.from)}</span><span class="msg-time">${esc(m.time)}</span></div>${m.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
  }
  if(!qt && !m) h += '<div class="gap"></div>';
  return h;
}

function optsHTML(opts){
  return `<div class="opts" role="group">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>`;
}

function bindOpts(opts, onPick){
  const wrap = app.querySelector('.opts');
  wrap.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      wrap.classList.add('locked');
      b.classList.add('sel');
      const o = opts[+b.dataset.i];
      setTimeout(()=>onPick(o), 380);
    });
  });
}

function record(o, rel){ S.ans.push({ rel, tg:o.tg||{} }); }

/* ---------- 畫面 ---------- */
function showStart(){
  render(`
    <div class="kicker">一份關於你的小測驗</div>
    <h1 class="title">你心裡的那條線</h1>
    <div class="rule"></div>
    <p class="body" style="margin-bottom:.8rem">生活裡，總有些時候，別人的需要和你自己的狀態撞在一起。</p>
    <p class="body">那些時候，你會怎麼選？</p>
    <div class="meta"><span>8 個情境</span><span>約 5–8 分鐘</span></div>
    <p class="small" style="margin-bottom:2rem">沒有對錯，選最接近你真實反應的那一個就好。</p>
    <div class="center"><button class="btn" id="go">開始</button></div>
  `, ()=>{ document.getElementById('go').onclick = showSelf; });
}

function showSelf(){
  render(`
    <div class="kicker">在開始之前</div>
    <h2 class="h2">你覺得自己比較是？</h2>
    <div class="rule"></div>
    <p class="body">當別人需要你，而你自己也有事、也很累的時候。</p>
    <div class="slider-val"><b id="sv">${S.self}</b><span>/ 10</span></div>
    <input type="range" min="1" max="10" step="1" value="${S.self}" id="sr" aria-label="自評分數，1 是先顧好自己，10 是先顧別人">
    <div class="ends"><span>先顧好自己</span><span>先顧別人</span></div>
    <p class="small" style="text-align:center;margin-bottom:2rem">憑直覺就好</p>
    <div class="center"><button class="btn" id="go">下一步</button></div>
  `, ()=>{
    const r = document.getElementById('sr'), v = document.getElementById('sv');
    r.oninput = ()=>{ S.self = +r.value; v.textContent = r.value; };
    document.getElementById('go').onclick = ()=>{ S.qi = 0; showMain(); };
  });
}

function showMain(){
  const q = QUESTIONS[S.qi];
  render(progressHTML() + sceneHTML(q.scene) + optsHTML(q.opts), ()=>{
    bindOpts(q.opts, o=>{
      record(o, q.rel);
      if(q.single) return advance();
      if(o.fu) return showFollow(o.fu, o.rc, ()=>showExt(o));
      showExt(o);
    });
  });
}

function showExt(mainOpt){
  const q = QUESTIONS[S.qi];
  const e = mainOpt.ext;
  render(progressHTML() + `<p class="recap">${esc(mainOpt.rc)}</p>` + sceneHTML(e.scene, e.quote, e.msg) + optsHTML(e.opts), ()=>{
    bindOpts(e.opts, o=>{
      record(o, q.rel);
      if(o.fu) return showFollow(o.fu, o.rc, advance);
      advance();
    });
  });
}

function showFollow(key, recap, then){
  const q = QUESTIONS[S.qi];
  const f = FOLLOWUPS[key];
  render(progressHTML() + `<p class="recap">${esc(recap)}</p><div class="inward"><p class="ask">${esc(f.ask)}</p>${optsHTML(f.opts)}</div>`, ()=>{
    bindOpts(f.opts, o=>{ record(o, q.rel); then(); });
  });
}

function advance(){
  S.qi++;
  if(S.qi >= QUESTIONS.length) showResult();
  else showMain();
}

function analyze(){
  const A = S.ans;
  const gv = {o:1,m:.5,s:0}, sv = {d:1,f:.6,h:0,a:0};
  let gSum=0,gN=0; const relG={}, relS={}, relGap={};
  const sayC={d:0,f:0,h:0,a:0}, heartC={w:0,g:0,i:0,l:0,u:0};
  let senseHi=0, senseLo=0, gapN=0;
  const catGap={t:0,e:0,f:0,u:0}, catOk={t:0,e:0,f:0,u:0};
  const pat={after:0,sna:0,ag:0,avoid:0};
  const flags=new Set(); let att=null;

  A.forEach(({rel,tg})=>{
    if(tg.g){ gSum+=gv[tg.g]; gN++; (relG[rel]=relG[rel]||[]).push(gv[tg.g]); }
    if(tg.y){ sayC[tg.y]++; (relS[rel]=relS[rel]||[]).push(sv[tg.y]); }
    if(tg.h) heartC[tg.h]++;
    if(tg.c===1) senseHi++; if(tg.c===-1) senseLo++;
    if(tg.gap){ gapN++; catGap[tg.gap]++; relGap[rel]=(relGap[rel]||0)+1; }
    if(tg.ok) catOk[tg.ok]++;
    (tg.p||[]).forEach(p=>pat[p]++);
    (tg.f||[]).forEach(f=>flags.add(f));
    if(tg.att) att = tg.att;
  });

  const ratio = gN? gSum/gN : .5;
  const giveLv = ratio>=.6?'o':ratio<=.4?'s':'m';
  const pick = (obj, order)=> order.reduce((b,k)=> obj[k]>obj[b]?k:b, order[0]);
  const sayLv = pick(sayC,['h','f','d','a']);
  const heartLv = pick(heartC,['g','u','i','w','l']);
  const sTot = senseHi+senseLo;
  const senseLv = !sTot?'mid': (senseHi/sTot>=.6?'hi': senseHi/sTot<=.35?'lo':'mid');
  const avg = a=>a.reduce((x,y)=>x+y,0)/a.length;

  return { ratio, giveLv, sayLv, heartLv, senseLv, relG, relS, relGap, gapN, catGap, catOk, pat, flags, att, avg, sayC };
}

function buildResult(){
  const R = analyze();
  const out = {};

  /* 0. 對照 */
  const real = Math.max(1, Math.min(10, Math.round(R.ratio*10*2)/2));
  const self = S.self;
  const diff = real - self;
  const cheng = Math.round(R.ratio*10);
  let cmp;
  if(Math.abs(diff) < 2) cmp = `你給自己 ${self} 分，而你的選擇也落在差不多的位置。你對自己的了解很準確。`;
  else if(diff > 0) cmp = `你給自己 ${self} 分，但你的選擇其實是 ${real} 分。在這次的選擇裡，你有 ${cheng} 成的時候都先顧了別人。你比自己以為的更常先顧別人，也許你的付出已經自然到，連自己都沒發現。`;
  else cmp = `你給自己 ${self} 分，但你的選擇其實是 ${real} 分。在這次的選擇裡，你有 ${10-cheng} 成的時候先顧了自己。你比自己以為的更懂得照顧自己，心裡覺得「應該」怎麼做，和實際的選擇不太一樣。`;
  if(Math.abs(diff) >= 4) cmp += '這個落差不小，也許值得想一想：你心中的自己，是從哪裡來的？';
  out.cmp = { self, real, text:cmp };

  /* 1. 整體 */
  const p1 = [T_GIVE[R.giveLv], T_SAY[R.sayLv], T_HEART[R.heartLv], T_SENSE[R.senseLv]];
  let bridge = '';
  if(R.senseLv==='hi' && (R.sayLv==='h'||R.sayLv==='a')) bridge = '你讀得懂別人沒說的情緒，卻很少讓別人讀懂你的。';
  else if(R.giveLv==='o' && R.sayLv==='h') bridge = '你給出去的很多，說出口的卻很少。';
  else if(R.giveLv==='s' && R.sayLv==='d') bridge = '你知道自己要什麼，也說得出口，這讓你在關係裡很少迷路。';
  out.whole = { paras:[p1[0], p1[1]+p1[2], p1[3]+(bridge?bridge:'')] };

  /* 2. 不同關係 */
  const rels = Object.keys(R.relG);
  const relAvg = {}; rels.forEach(r=> relAvg[r]=R.avg(R.relG[r]));
  const sorted = rels.slice().sort((a,b)=>relAvg[b]-relAvg[a]);
  const hi = sorted[0], lo = sorted[sorted.length-1];
  let giveTxt;
  const allAvg = R.ratio;
  if(relAvg[hi]-relAvg[lo] < .25){
    giveTxt = allAvg>=.6 ? '不管對誰，你都很習慣先照顧對方，這是你的溫柔，也可能是你累的原因。' : '你對每個人的界線都很一致，不太因為關係遠近而改變。';
  } else {
    const closeV = rels.filter(r=>CLOSE.has(r)).map(r=>relAvg[r]);
    const farV = rels.filter(r=>!CLOSE.has(r)).map(r=>relAvg[r]);
    const cd = (closeV.length&&farV.length)? R.avg(closeV)-R.avg(farV) : 0;
    let tail;
    if(cd >= .2) tail = '你的付出跟著親疏走，越在乎的人，你越願意放下自己。';
    else if(cd <= -.2) tail = '你在親近的人面前反而比較能做自己，因為你相信他們接得住你的拒絕；面對不熟的人，你卻很難開口說不。';
    else tail = '你的界線不是不存在，而是會依照每段關係、每個人移動。';
    giveTxt = `${GIVE_HI[hi]}；但${GIVE_LO[lo]}。${tail}`;
  }
  let sayTxt = '';
  const sRels = Object.keys(R.relS);
  if(sRels.length >= 2){
    const sAvg = {}; sRels.forEach(r=> sAvg[r]=R.avg(R.relS[r]));
    const ss = sRels.slice().sort((a,b)=>sAvg[b]-sAvg[a]);
    const sh = ss[0], sl = ss[ss.length-1];
    if(sAvg[sh]-sAvg[sl] < .3) sayTxt = '你表達感受的方式，不太因為對象而改變。';
    else {
      sayTxt = `你對${REL_NAME[sh]}能直接說出感受，但對${REL_NAME[sl]}，你多半放在心裡。`;
      if(CLOSE.has(sh) && !CLOSE.has(sl)) sayTxt += '在越安心的關係裡，你越敢說真話。';
      else if(!CLOSE.has(sh) && CLOSE.has(sl)) sayTxt += '越在乎的人，你越怕說出口會傷到關係。';
    }
  }
  out.rel = { paras:[giveTxt, sayTxt].filter(Boolean) };

  /* 3. 說與不說 */
  let gapTxt = R.gapN<=1 ? '你說的和心裡想的大多一致。說沒關係時，通常就是真的沒關係；不開心時，也會讓對方知道。這讓和你相處的人很安心，不需要猜。'
    : R.gapN<=3 ? '大部分時候你都說真話，但有些時刻，你會把真正的感受收起來。通常是怕氣氛變僵，或是覺得「這點小事不值得說」。'
    : '你很習慣說「沒關係」，但其實每一次都記得。那些沒說出口的失落和委屈，不會因為沒說就消失，只是被你一個人收著。';
  const gapCats = Object.keys(R.catGap).filter(k=>R.catGap[k]>0).sort((a,b)=>R.catGap[b]-R.catGap[a]);
  const okCats = Object.keys(R.catOk).filter(k=>R.catOk[k]>0 && R.catGap[k]===0).sort((a,b)=>R.catOk[b]-R.catOk[a]);
  let catTxt = '';
  if(gapCats.length && okCats.length) catTxt = `對於${CAT_NAME[okCats[0]]}，你是真的不太在意；但遇到${CAT_NAME[gapCats[0]]}，你嘴上說沒關係，心裡其實很在意。${CAT_WHY[gapCats[0]]}`;
  else if(gapCats.length) catTxt = `尤其遇到${CAT_NAME[gapCats[0]]}，你嘴上說沒關係，心裡其實很在意。${CAT_WHY[gapCats[0]]}`;
  let extra = '';
  const gr = Object.keys(R.relGap).sort((a,b)=>R.relGap[b]-R.relGap[a])[0];
  if(gr && R.relGap[gr] >= 2) extra += `這種落差，在${REL_WITH[gr]}特別明顯。`;
  if(R.flags.has('misread')) extra += '有些時候，你甚至以為自己不在意，直到後來才發現，你比自己想的更在意。';
  if(R.flags.has('stillfine')) extra += '就算有人主動問起，你還是習慣說「我很好」。';
  out.gap = { paras:[gapTxt, catTxt, extra].filter(Boolean) };

  /* 4. 沒發現的事 */
  const score = {};
  ['after','sna','ag','avoid'].forEach(k=>{ if(R.pat[k]>=2) score[k]=R.pat[k]; });
  if(R.flags.has('late') && R.senseLv==='lo') score.late = 2;
  if(R.att==='separate' && R.flags.has('helpsep')) score.mis1 = 2;
  if(R.att==='friend' && R.flags.has('notclose')) score.mis2 = 2;
  const pats = Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,2);
  out.hidden = { paras: pats.length ? pats.map(k=>PATTERNS[k]) : [NO_PATTERN[R.giveLv]] };

  /* 5. 提醒 */
  const tipKeys = [];
  const add = k=>{ if(!tipKeys.includes(k)) tipKeys.push(k); };
  if(score.after) add('now');
  if(score.sna) add('small');
  if(score.avoid || R.sayLv==='a') add('direct');
  if(score.ag || R.heartLv==='u') add('noguilt');
  if(R.heartLv==='g' || gapCats.length) add('speak');
  if(R.heartLv==='i') add('tired');
  if(R.giveLv==='o' || R.gapN>=4) add('self');
  if(R.senseLv==='lo') add('signal');
  if(R.giveLv==='s') add('close');
  if(!tipKeys.length) add(R.giveLv==='m' ? 'signal' : 'self');
  out.tips = tipKeys.slice(0,3).map(k=>TIPS[k]);

  return out;
}

function showResult(){
  const r = buildResult();
  const pos = v => ((v-1)/9*100).toFixed(1)+'%';
  const card = (title, paras, cls='') => `<section class="rcard ${cls}"><h3>${title}</h3>${paras.map(p=>`<p>${esc(p)}</p>`).join('')}</section>`;
  render(`
    <div class="kicker">你心裡的那條線</div>
    <h1 class="h2">你的結果</h1>
    <div class="rule"></div>
    <section class="cmp">
      <p class="lab">你以為的你，和選擇裡的你</p>
      <div class="row"><span>你以為的你</span><span>${r.cmp.self}</span></div>
      <div class="axis"><div class="dot self" style="left:${pos(r.cmp.self)}"></div></div>
      <div class="row"><span>選擇裡的你</span><span>${r.cmp.real}</span></div>
      <div class="axis"><div class="dot real" style="left:${pos(r.cmp.real)}"></div></div>
      <div class="ends-sm"><span>先顧好自己</span><span>先顧別人</span></div>
      <p class="body">${esc(r.cmp.text)}</p>
    </section>
    ${card('整體的你', r.whole.paras)}
    ${card('在不同的人面前', r.rel.paras)}
    ${card('說與不說之間', r.gap.paras)}
    ${card('你可能沒發現的事', r.hidden.paras)}
    <section class="rcard letter">
      <h3>給你的提醒</h3>
      ${r.tips.map(t=>`<div class="tip"><h4>${esc(t.t)}</h4><p><span class="k">多注意</span>${esc(t.a)}</p><p><span class="k">觀察</span>${esc(t.b)}</p><p><span class="k">試試看</span>${esc(t.c)}</p></div>`).join('')}
      <p class="closing">這些不是你的缺點，只是讓你能更舒服地和別人相處的方向。</p>
    </section>
    <div class="center" style="margin-top:1.6rem"><button class="btn btn-ghost" id="again">再測一次</button></div>
  `, ()=>{ document.getElementById('again').onclick = ()=>{ reset(); showStart(); }; });
}

showStart();
</script>
</body>
</html>
